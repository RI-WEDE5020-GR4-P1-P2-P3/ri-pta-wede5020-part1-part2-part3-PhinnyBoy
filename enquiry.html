<!DOCTYPE html>
<html>

<head>

    <title>QuickFix SA - Enquiry</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <img src="images/QuickfixLogo.png" alt="QuickFix SA Logo" width="150">

        <h1>QuickFix SA</h1>

        <p>Property Services & Marketplace</p>

    </header>


    <!--NAVIGATION-->

    <nav>

        <a href="index.html">Home</a>

        <a href="about.html">About Us</a>

        <a href="services.html">Services</a>

        <a href="properties.html">Properties</a>

        <a href="enquiry.html">Enquiry</a>

        <a href="contact.html">Contact</a>

    </nav>


    <!--MAIN CONTENT-->

    <main>

        <h2>Make an Enquiry</h2>

        <p>
        Complete the form below and tell us what
            property service you require.
        </p>


        <!-- ENQUIRY FORM -->

        <form>
         <!--Name-->
            <label for="name">
            Full Name:
            </label>

            <br>

            <input type="text" id="name" name="name">

            <br><br>

        <!--Email-->
            <label for="email">
                Email Address:
            </label>

            <br>

            <input type="email" id="email" name="email">

            <br><br>

        <!--Phone-->
            <label for="phone">
                Phone Number:
            </label>

            <br>

            <input type="tel" id="phone" name="phone">

            <br><br>


            <!-- Enquiry Type -->
            <label for="enquiry-type">
                Enquiry Type:
            </label>

            <br>

            <select id="enquiry-type" name="enquiry-type">

                <option value="property">
                    Property Enquiry
                </option>

                <option value="repair">
                    Repair Service
                </option>

                <option value="general">
                    General Enquiry
                </option>

            </select>

            <br><br>


            <!-- Your Message -->
            <label for="message">
                Your Message:
            </label>

            <br>

            <textarea id="message"
                      name="message"
                      rows="6"
                      cols="40"></textarea>

            <br><br>


            <input type="submit" value="Submit Enquiry">

        </form>

    </main>


    <!--FOOTER-->

    <footer>

        <h3>QuickFix SA</h3>

        <p>Property Services & Marketplace</p>

        <p>2026 QuickFix SA</p>

    </footer>

</body>

</html>
